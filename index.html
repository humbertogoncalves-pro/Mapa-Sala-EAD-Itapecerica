<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        body {
            background: 
                radial-gradient(ellipse at top left, rgba(244, 121, 32, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(244, 121, 32, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, #fafaf9 0%, #f5f5f4 100%);
            background-attachment: fixed;
        }

        .table-container::-webkit-scrollbar { height: 6px; }
        .table-container::-webkit-scrollbar-track { background: transparent; }
        .table-container::-webkit-scrollbar-thumb { 
            background: linear-gradient(90deg, #F47920, #E8651A); 
            border-radius: 10px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.04),
                0 10px 20px -5px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .premium-header {
            background: 
                linear-gradient(135deg, #F47920 0%, #E8651A 50%, #D4551A 100%);
            position: relative;
            overflow: hidden;
        }
        .premium-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .premium-header::after {
            content: '';
            position: absolute;
            bottom: -60%;
            left: -5%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .badge-dia {
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            border: 2px solid;
            background: white;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.2s ease;
        }
        .badge-dia:hover { transform: translateY(-1px); }
        .badge-dia .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .dia-segunda { border-color: #3B82F6; color: #1E40AF; }
        .dia-segunda .dot { background: #3B82F6; }
        .dia-terca { border-color: #10B981; color: #065F46; }
        .dia-terca .dot { background: #10B981; }
        .dia-quarta { border-color: #8B5CF6; color: #5B21B6; }
        .dia-quarta .dot { background: #8B5CF6; }
        .dia-quinta { border-color: #EC4899; color: #9D174D; }
        .dia-quinta .dot { background: #EC4899; }
        .dia-sexta { border-color: #F59E0B; color: #92400E; }
        .dia-sexta .dot { background: #F59E0B; }

        .badge-turno {
            padding: 0.3rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            text-transform: uppercase;
        }
        .turno-manha {
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            color: #92400E;
            border: 1px solid #FCD34D;
        }
        .turno-noite {
            background: linear-gradient(135deg, #E0E7FF 0%, #C7D2FE 100%);
            color: #3730A3;
            border: 1px solid #A5B4FC;
        }

        .badge-sala {
            padding: 0.35rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            border: px solid;
        }
        .sala-bloco-a {
            background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%);
            color: #C2410C;
            border-color: #FDBA74;
        }
        .sala-bloco-b {
            background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 100%);
            color: #6D28D9;
            border-color: #C4B5FD;
        }

        .linha-tabela {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .linha-tabela:hover {
            background: linear-gradient(90deg, rgba(244, 121, 32, 0.04) 0%, rgba(244, 121, 32, 0.08) 50%, rgba(244, 121, 32, 0.04) 100%);
            transform: scale(1.002);
            box-shadow: 0 2px 8px rgba(244, 121, 32, 0.08);
        }

        .input-premium {
            transition: all 0.2s ease;
            background: white;
        }
        .input-premium:focus {
            box-shadow: 0 0 0 3px rgba(244, 121, 32, 0.15), 0 4px 12px rgba(244, 121, 32, 0.1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.4s ease-out forwards;
        }

        .divider-premium {
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(244, 121, 32, 0.3) 50%, transparent 100%);
        }
    </style>
</head>
<body class="text-stone-800 min-h-screen flex flex-col">

                </div>
            </div>
        </div>
        <div class="h-[2px] bg-gradient-to-r from-transparent via-white/40 to-transparent"></div>
    </header>

            </div>

            <div class="w-full md:w-52">

                </label>
                <select id="filtro-dia" class="input-premium w-full p-2.5 border border-stone-200 rounded-lg outline-none text-sm bg-white">

            </div>

            <div class="w-full md:w-40">

                     Turno

                    <option value="">Todos</option>

                    <option value="Noite">Noite</option>

            </div>
        </div>

                <div class="flex items-center gap-2">
                    <div class="w-1 h-6 bg-gradient-to-b from-[#F47920] to-[#C2410C] rounded-full"></div>
                    <h2 class="font-bold text-stone-800 text-sm tracking-tight">Grade de Salas</h2>
                </div>
                <span class="text-[0.65rem] font-semibold text-stone-400 uppercase tracking-wider">
                    Mostrando <span id="contador-resultados" class="text-[#F47920] font-bold text-xs">0</span> turmas

                    <tbody id="tabela-corpo" class="bg-white">

            <div id="mensagem-vazio" class="hidden text-center py-12">

                <p class="text-stone-400 text-xs mt-1">Tente ajustar sua busca.</p>
            </div>
        </div>
        
        <div class="flex items-center justify-center gap-2 text-xs text-stone-400 mt-2">
            <div class="divider-premium flex-grow max-w-[100px]"></div>
            <span class="font-medium">Sistema de Gestão de Salas EAD</span>
            <div class="divider-premium flex-grow max-w-[100px]"></div>
        </div>
    </main>

            'Quinta-feira': 'dia-quinta',
            'Sexta-feira': 'dia-sexta'
        };

        function renderizarTabela(dados) {
            corpoTabela.innerHTML = '';
            
            if (dados.length === 0) {
                mensagemVazio.classList.remove('hidden');
            } else {
                mensagemVazio.classList.add('hidden');

                    const tr = document.createElement('tr');
                    tr.className = 'linha-tabela';
                    tr.style.animationDelay = `${index * 0.02}s`;
                    
                    const classeDia = classesDia[item.dia] || 'dia-segunda';

                    const iconeSala = item.bloco === 'B' ? '🏛️' : '🔬';

                    tr.innerHTML = `
                        <td class="p-4 font-semibold text-stone-800 text-sm">${item.curso}</td>
                        <td class="p-4">
                            <span class="badge-dia ${classeDia}">

                        </td>
                        <td class="p-4">
                            <span class="badge-turno ${classeTurno}">
                                <span>${iconeTurno}</span>
                                ${item.turno}
                            </span>
                        </td>
                        <td class="p-4 text-stone-600 font-medium text-sm">${item.serie}</td>
                        <td class="p-4 text-center">
                            <span class="badge-sala ${classeSala}">
                                <span>${iconeSala}</span>
                                Bloco ${item.bloco} · ${item.sala}
                            </span>
                        </td>
                    `;
                    corpoTabela.appendChild(tr);
                });
            }
            
            contador.textContent = dados.length;
        }

        function filtrarDados() {
            const textoBusca = inputBusca.value.toLowerCase();
            const diaFiltrado = selectDia.value;
            const turnoFiltrado = selectTurno.value;

            const dadosFiltrados = dadosSalas.filter(item => {
                const textoMatch = item.curso.toLowerCase().includes(textoBusca) || 
                                   item.sala.toLowerCase().includes(textoBusca);
                const diaMatch = diaFiltrado === "" || item.dia === diaFiltrado;
                const turnoMatch = turnoFiltrado === "" || item.turno === turnoFiltrado;
                
                return textoMatch && diaMatch && turnoMatch;
            });

            renderizarTabela(dadosFiltrados);
        }

        inputBusca.addEventListener('input', filtrarDados);
        selectDia.addEventListener('change', filtrarDados);
        selectTurno.addEventListener('change', filtrarDados);

        selectDia.value = ""; 
        renderizarTabela(dadosSalas);
    </script>
</body>
</html>
